name: linux phone tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: node --test tests/linux-phone.test.mjs tests/flatpak.test.mjs tests/audio-stream-path.test.mjs tests/phone-lab.test.mjs tests/startup-diagnostics.test.mjs tests/release-assets.test.mjs tests/release-workflow.test.mjs

  musl:
    runs-on: ubuntu-22.04-arm
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/musl-cargo/registry
            ${{ runner.temp }}/musl-cargo/git
            src-tauri/target/aarch64-unknown-linux-musl
          key: musl-alpine322-arm64-thin16-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: musl-alpine322-arm64-thin16-
      - name: Build and test the ARM musl backend
        run: |
          mkdir -p "$RUNNER_TEMP/musl-cargo"
          docker run --rm \
            --volume "$PWD:/wave" \
            --volume "$RUNNER_TEMP/musl-cargo:/root/.cargo" \
            --workdir /wave \
            --env CARGO_PROFILE_RELEASE_LTO \
            --env CARGO_PROFILE_RELEASE_CODEGEN_UNITS \
            alpine:3.22 sh scripts/musl-build.sh
      - name: Restore cache ownership
        if: always()
        run: |
          for path in "$RUNNER_TEMP/musl-cargo" src-tauri/target/aarch64-unknown-linux-musl; do
            if [ -e "$path" ]; then
              sudo chown -R "$(id -u):$(id -g)" "$path"
            fi
          done
      - name: Verify installation in a clean Alpine runtime
        run: |
          docker run --rm --shm-size 512m \
            --env WAVE_TEST_WEBKIT_SANDBOX=0 --volume "$PWD:/wave:ro" --workdir /wave \
            alpine:3.22 sh scripts/musl-runtime-test.sh
      - name: Verify the interactive phone lab
        run: |
          version=$(tr -d '\r\n' < VERSION)
          archive="$PWD/src-tauri/target/musl/Wave_${version}_aarch64_musl.tar.gz"
          docker build --platform linux/arm64 -f scripts/phone-lab.Dockerfile -t wave-phone-lab-ci .
          docker run -d --name wave-phone-lab-ci --shm-size 512m \
            --mount "type=bind,source=$archive,target=/input/wave.tar.gz,readonly" \
            --mount "type=bind,source=$PWD/tests,target=/wave-tests,readonly" wave-phone-lab-ci
          trap 'docker logs wave-phone-lab-ci; docker rm -f wave-phone-lab-ci' EXIT
          docker exec -u wave -e HOME=/home/wave -e XDG_RUNTIME_DIR=/home/wave/runtime -e DISPLAY=:0 \
            wave-phone-lab-ci sh /wave-tests/phone-lab-audio.test.sh
          docker exec wave-phone-lab-ci apk add --no-cache xwd imagemagick
          docker exec -u wave -e HOME=/home/wave -e XDG_RUNTIME_DIR=/home/wave/runtime -e DISPLAY=:0 \
            wave-phone-lab-ci sh /wave-tests/phone-lab-picker.test.sh

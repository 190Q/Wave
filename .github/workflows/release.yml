name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.1.5)"
        required: true
      features:
        description: "One new feature per line, left out when there are none"
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  prepare:
    name: prepare release
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check Android signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE is missing; add the base64-encoded existing signing keystore before publishing"
            exit 1
          fi
          key="$RUNNER_TEMP/wave-signing.keystore"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$KEYSTORE" | base64 --decode > "$key"
          if ! keytool -list -keystore "$key" -storepass android -alias androiddebugkey > /dev/null 2>&1; then
            echo "::error::ANDROID_KEYSTORE is not a valid Wave debug signing keystore"
            exit 1
          fi

      - run: node scripts/release.mjs status

      - name: Create the draft release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAVE_RELEASE_FEATURES: ${{ inputs.features }}
        run: |
          node scripts/release.mjs prepare "$RELEASE_TAG"
          release_id=$(gh release view "$RELEASE_TAG" --json databaseId --jq '.databaseId')
          echo "id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows-latest
          - ubuntu-22.04
          - ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file rpm libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}

      - name: Build the slim installers
        run: node scripts/release.mjs slim --reuse-build

      - name: Verify Linux RPM packages
        if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        run: |
          version=$(tr -d '\r\n' < VERSION)
          full="src-tauri/target/release/bundle/rpm/Wave-$version-1.$(uname -m).rpm"
          slim="src-tauri/target/release/bundle/rpm/Wave-$version-1.$(uname -m)-slim.rpm"
          rpm --checksig "$full" "$slim"
          for package in "$full" "$slim"; do
            test "$(rpm -qp --queryformat '%{PAYLOADCOMPRESSOR}' "$package")" = zstd
          done
          for tool in yt-dlp ffmpeg ffprobe deno; do
            rpm -qpl "$full" | grep -Fx "/usr/lib/Wave/tools/$tool"
            if rpm -qpl "$slim" | grep -Fx "/usr/lib/Wave/tools/$tool"; then
              exit 1
            fi
          done

      - name: Attach the slim installers
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.mjs upload-slim "$RELEASE_TAG"

      - name: Set up the phone Flatpak runtime
        if: matrix.platform == 'ubuntu-22.04-arm'
        run: |
          sudo apt-get install -y flatpak xvfb xdotool dbus-x11 pulseaudio pulseaudio-utils
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub org.gnome.Platform//51

      - name: Build the phone Flatpak
        if: matrix.platform == 'ubuntu-22.04-arm'
        run: |
          npx tauri build --no-bundle --config src-tauri/tauri.phone.conf.json
          sh scripts/flatpak-build.sh

      - name: Verify the phone Flatpak
        if: matrix.platform == 'ubuntu-22.04-arm'
        run: |
          version=$(tr -d '\r\n' < VERSION)
          flatpak install --user --noninteractive -y "src-tauri/target/flatpak/Wave_${version}_aarch64_phone.flatpak"
          dbus-run-session -- xvfb-run -a -s "-screen 0 360x720x24" sh scripts/flatpak-runtime-test.sh

      - name: Attach and verify the phone Flatpak
        if: matrix.platform == 'ubuntu-22.04-arm'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(tr -d '\r\n' < VERSION)
          asset="Wave_${version}_aarch64_phone.flatpak"
          node scripts/release.mjs upload "$RELEASE_TAG" "src-tauri/target/flatpak/$asset"
          mkdir -p "$RUNNER_TEMP/flatpak-download"
          gh release download "$RELEASE_TAG" --pattern "$asset" --dir "$RUNNER_TEMP/flatpak-download"
          cmp "src-tauri/target/flatpak/$asset" "$RUNNER_TEMP/flatpak-download/$asset"

  musl:
    name: build (linux phone musl)
    needs: prepare
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/musl-cargo/registry
            ${{ runner.temp }}/musl-cargo/git
            src-tauri/target/aarch64-unknown-linux-musl
          key: musl-alpine322-arm64-thin16-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: musl-alpine322-arm64-thin16-

      - name: Build the musl package
        run: |
          mkdir -p "$RUNNER_TEMP/musl-cargo"
          docker run --rm \
            --volume "$PWD:/wave" \
            --volume "$RUNNER_TEMP/musl-cargo:/root/.cargo" \
            --workdir /wave \
            --env CARGO_PROFILE_RELEASE_LTO \
            --env CARGO_PROFILE_RELEASE_CODEGEN_UNITS \
            alpine:3.22 \
            sh scripts/musl-build.sh

      - name: Restore musl cache ownership
        if: always()
        run: |
          for path in "$RUNNER_TEMP/musl-cargo" src-tauri/target/aarch64-unknown-linux-musl; do
            if [ -e "$path" ]; then
              sudo chown -R "$(id -u):$(id -g)" "$path"
            fi
          done

      - name: Verify the musl installer in a clean Alpine runtime
        run: |
          docker run --rm --shm-size 512m \
            --env WAVE_TEST_WEBKIT_SANDBOX=0 --volume "$PWD:/wave:ro" --workdir /wave \
            alpine:3.22 sh scripts/musl-runtime-test.sh

      - name: Attach the musl package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.mjs upload-musl "$RELEASE_TAG"

      - name: Verify the uploaded phone package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(tr -d '\r\n' < VERSION)
          asset="Wave_${version}_aarch64_musl.tar.gz"
          mkdir -p "$RUNNER_TEMP/phone-download"
          gh release download "$RELEASE_TAG" --pattern "$asset" --dir "$RUNNER_TEMP/phone-download"
          cmp "src-tauri/target/musl/$asset" "$RUNNER_TEMP/phone-download/$asset"

  android:
    name: build (android)
    needs: prepare
    runs-on: ubuntu-22.04
    env:
      NDK_VERSION: 27.0.12077973
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools

      - name: Android NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Write the signing keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::the ANDROID_KEYSTORE secret is not set, so the APK cannot be signed"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"

      - name: Build the APK
        run: node scripts/release.mjs apk

      - name: Attach the APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.mjs upload-apk "$RELEASE_TAG"

  publish:
    name: publish complete release
    needs: [prepare, build, musl, android]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify assets and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.mjs finalize "$RELEASE_TAG"

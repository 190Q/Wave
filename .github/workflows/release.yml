name: release

# Dispatched by `scripts/release.mjs publish`, which carries the feature list
# with it. A tag pushed on its own builds nothing.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.1.5)"
        required: true
      features:
        description: "One new feature per line, left out when there are none"
        required: false

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      # One platform failing must not stop the others from publishing.
      fail-fast: false
      matrix:
        platform:
          - windows-latest
          - ubuntu-22.04
          - ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: node scripts/release.mjs status

      # The body is written by the release tool, so this build and a build made
      # on a machine read the same. The default shell on windows-latest is
      # PowerShell, which cannot write a heredoc into GITHUB_OUTPUT.
      - name: Compose the release body
        id: body
        shell: bash
        env:
          WAVE_RELEASE_FEATURES: ${{ inputs.features }}
        run: |
          {
            echo 'body<<WAVE_BODY'
            node scripts/release.mjs body
            echo 'WAVE_BODY'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: "Wave ${{ inputs.tag }}"
          releaseBody: ${{ steps.body.outputs.body }}
          releaseDraft: false
          prerelease: false

      # The slim build reuses the target directory the step above filled, so it
      # only recompiles the app, and the release it attaches to already exists.
      - name: Build the slim installers
        run: node scripts/release.mjs slim

      - name: Attach the slim installers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.mjs upload-slim ${{ inputs.tag }}

      - name: Build the musl package
        if: matrix.platform == 'ubuntu-22.04-arm'
        run: |
          docker run --rm \
            --volume "$PWD:/wave" \
            --workdir /wave \
            alpine:3.22 \
            sh scripts/musl-build.sh

      - name: Attach the musl package
        if: matrix.platform == 'ubuntu-22.04-arm'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.mjs upload-musl ${{ inputs.tag }}

name: release

# Dispatched by `scripts/release.mjs publish`, which carries the feature list
# with it. A tag pushed on its own builds nothing.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.1.5)"
        required: true
      features:
        description: "One new feature per line, left out when there are none"
        required: false

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      # One platform failing must not stop the others from publishing.
      fail-fast: false
      matrix:
        platform:
          - windows-latest
          - ubuntu-22.04
          - ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: node scripts/release.mjs status

      # The body is written by the release tool, so this build and a build made
      # on a machine read the same. The default shell on windows-latest is
      # PowerShell, which cannot write a heredoc into GITHUB_OUTPUT.
      - name: Compose the release body
        id: body
        shell: bash
        env:
          WAVE_RELEASE_FEATURES: ${{ inputs.features }}
        run: |
          {
            echo 'body<<WAVE_BODY'
            node scripts/release.mjs body
            echo 'WAVE_BODY'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: "Wave ${{ inputs.tag }}"
          releaseBody: ${{ steps.body.outputs.body }}
          releaseDraft: false
          prerelease: false

      # The slim build reuses the target directory the step above filled, so it
      # only recompiles the app, and the release it attaches to already exists.
      - name: Build the slim installers
        run: node scripts/release.mjs slim

      - name: Attach the slim installers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.mjs upload-slim ${{ inputs.tag }}

      - name: Build the musl package
        if: matrix.platform == 'ubuntu-22.04-arm'
        run: |
          docker run --rm \
            --volume "$PWD:/wave" \
            --workdir /wave \
            alpine:3.22 \
            sh scripts/musl-build.sh

      - name: Attach the musl package
        if: matrix.platform == 'ubuntu-22.04-arm'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.mjs upload-musl ${{ inputs.tag }}

  # The APK a phone updates from. It is signed with the keystore the copy on the
  # phone was built with, which is held as a secret: an update only installs over
  # a build that carries the same signature. The keystore is the standard debug
  # one, so a phone that has been running locally built APKs updates in place.
  android:
    name: build (android)
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.0.12077973
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Android NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Write the signing keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::the ANDROID_KEYSTORE secret is not set, so the APK cannot be signed"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"

      - name: Build the APK
        run: node scripts/release.mjs apk

      # The desktop builds are what create the release, and they run alongside
      # this job, so the upload waits for it to exist.
      - name: Attach the APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in $(seq 1 30); do
            gh release view "${{ inputs.tag }}" > /dev/null 2>&1 && break
            echo "waiting for ${{ inputs.tag }} to be published"
            sleep 20
          done
          node scripts/release.mjs upload-apk ${{ inputs.tag }}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wave</title>
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/app.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="stage" id="stage">
      <aside class="sheet" id="sheet" aria-label="Library">
        <div class="sheet-head">
          <h2>Library</h2>
          <div class="sheet-head-actions">
            <button class="pill" id="sheet-back" type="button" hidden>Back</button>
            <button class="pill" id="new-playlist" type="button">New playlist</button>
            <button class="pill icon-only" id="sheet-close" type="button" aria-label="Close library">
              <span class="btn-icon" data-icon="close"></span>
            </button>
          </div>
        </div>

        <input
          class="search sheet-search"
          id="sheet-search"
          type="search"
          placeholder="Filter collections"
          aria-label="Filter collections"
          autocomplete="off"
        />

        <div class="chips" id="chips">
          <button class="pill is-on" type="button" data-filter="all">All</button>
          <button class="pill" type="button" data-filter="liked">Liked</button>
          <button class="pill" type="button" data-filter="playlists">Playlists</button>
          <button class="pill" type="button" data-filter="artists">Artists</button>
          <button class="pill" type="button" data-filter="albums">Albums</button>
        </div>

        <div class="sheet-tools">
          <span id="sheet-count"></span>
          <button class="pill sort-button" id="sheet-sort" type="button" aria-haspopup="true" aria-label="Sort collections">
            <span id="sheet-sort-label">A to Z</span>
            <span class="sort-chevron" aria-hidden="true"></span>
          </button>
        </div>

        <div class="sheet-list" id="library"></div>
        <div class="sheet-foot" id="folders"></div>
      </aside>

      <header class="topbar">
        <span class="brand" data-icon="app-icon" aria-hidden="true"></span>
        <button class="pill pill-strong" id="library-open" type="button">
          <span class="btn-icon" data-icon="library"></span>
          <span>Library</span>
        </button>
        <nav class="crates" id="recents" aria-label="Recent collections"></nav>

        <div class="search-wrap">
          <input
            class="search"
            id="search"
            type="search"
            placeholder="Search your library"
            aria-label="Search your library"
            autocomplete="off"
          />
          <div class="results" id="results" hidden></div>
        </div>

        <button class="pill" id="add-folder" type="button">
          <span class="btn-icon" data-icon="import"></span>
          <span>Add folder</span>
        </button>

        <div class="theme">
          <button class="pill" id="theme-toggle" type="button" aria-haspopup="true">
            <span class="btn-icon" data-icon="theme"></span>
            <span>Theme</span>
          </button>
          <div class="theme-menu" id="theme-menu" hidden></div>
        </div>
      </header>

      <section class="hero" id="hero">
        <div class="now-cover" id="now-cover"></div>
        <div class="now">
          <p class="kicker" id="now-source"></p>
          <h1 class="now-title" id="now-title"></h1>
          <p class="now-artist" id="now-artist"></p>
          <p class="now-meta" id="now-meta"></p>
        </div>
        <div class="lyrics" id="lyrics-panel" hidden>
          <div class="lyrics-track" id="lyrics"></div>
        </div>
      </section>

      <section class="dock" id="dock">
        <div class="dock-fill" id="dock-fill"></div>

        <div class="dock-inner">
          <div class="seek-row">
            <span class="time" id="time-now">0:00</span>
            <span class="time" id="time-total">0:00</span>
          </div>

          <div class="dock-row">
            <div class="dock-side">
              <button class="pill icon-pill" id="like" type="button" aria-label="Add to Liked Songs"></button>
              <span class="dock-position" id="dock-position"></span>
            </div>

            <div class="buttons">
              <button class="pill icon-pill" id="shuffle" type="button" aria-label="Shuffle">
                <span class="btn-icon" data-icon="shuffle"></span>
              </button>
              <button class="icon" id="prev" type="button" aria-label="Previous">
                <span class="btn-icon" data-icon="previous"></span>
              </button>
              <button class="icon" id="play" type="button" aria-label="Play"></button>
              <button class="icon" id="next" type="button" aria-label="Next">
                <span class="btn-icon" data-icon="next"></span>
              </button>
              <button class="pill icon-pill" id="repeat" type="button" aria-label="Repeat off">
                <span class="btn-icon" data-icon="repeat"></span>
              </button>
            </div>

            <div class="dock-side dock-end">
              <button class="pill icon-pill" id="queue-toggle" type="button" aria-label="Queue">
                <span class="btn-icon" data-icon="queue"></span>
              </button>
              <input class="volume" id="volume" type="range" min="0" max="100" value="70" aria-label="Volume" />
            </div>
          </div>
        </div>
      </section>

      <div class="carousel-space"></div>
      <div class="carousel" id="carousel" aria-label="Playback queue"></div>

      <p class="status" id="status" hidden></p>
    </main>
  </body>
</html>

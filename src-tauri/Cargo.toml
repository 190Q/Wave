[package]
name = "wave"
version = "0.1.2"
description = "Wave - a local-first music player"
authors = ["you"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.25.4"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
tauri-plugin-dialog = "2.8.2"
notify = "8.2.0"
reqwest = { version = "0.13.5", default-features = false, features = [
  "blocking",
  "charset",
  "form",
  "http2",
  "json",
  "native-tls",
  "query",
] }
ebur128 = "0.1.10"
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "alac", "aiff"] }
rusqlite = { version = "0.40.2", features = ["bundled"], default-features = false }
uuid = { version = "1", features = ["v4", "v5"] }
blake3 = "1"

# Used to turn off WebView2's own browser shortcuts (Ctrl+R, F5, F12, ...).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = "0.62"

[profile.dev.package."*"]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

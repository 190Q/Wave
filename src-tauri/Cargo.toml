[package]
name = "wave"
version = "0.2.0"
description = "Wave - a local-first music player"
authors = ["you"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.25.4"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
tauri-plugin-dialog = "2.8.2"
tauri-plugin-fs = "2.7.0"
tauri-plugin-notification = "2"
notify = "8.2.0"
ebur128 = "0.1.10"
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "alac", "aiff"] }
rusqlite = { version = "0.40.2", features = ["bundled"], default-features = false }
uuid = { version = "1", features = ["v4", "v5"] }
blake3 = "1"
# The local API. Blocking and thread-per-request, which is what the rest of the
# crate already is: no async runtime is pulled in for it.
tiny_http = "0.12"

discord-rich-presence = "1.1.0"

# Every HTTP request the crate makes: lyrics, cover art, genres, the Spotify and
# Deezer catalogues and the updater.
#
# Desktop keeps the platform's own TLS, which native-tls reaches through
# SChannel on Windows and OpenSSL elsewhere. Android has neither, and openssl
# will not build for it at all, so there rustls does the talking. reqwest 0.13
# calls its rustls backend `rustls-no-provider`, so the provider is picked
# here: ring, which needs nothing but the NDK's clang.
[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = [
  "blocking",
  "charset",
  "form",
  "http2",
  "json",
  "native-tls",
  "query",
] }

# The system's own media controls: the Windows media flyout and the media keys,
# or MPRIS on Linux. The zbus backend is pure Rust, so Linux needs no libdbus
# development package to build. Android has no souvlaki backend; the media
# session there is the Kotlin plugin in src/media_session.rs.
souvlaki = { version = "0.9.3", default-features = false, features = ["use_zbus"] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = [
  "blocking",
  "charset",
  "form",
  "http2",
  "json",
  "query",
  "rustls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = [
  "logging",
  "ring",
  "std",
  "tls12",
] }

# Used to turn off WebView2's own browser shortcuts (Ctrl+R, F5, F12, ...), to
# give a command the console it was run from, and to put the media controls
# worker in an apartment of its own.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.dev.package."*"]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
